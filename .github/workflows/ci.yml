name: CI & Container Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build WebUI & Server
        run: npm run build

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Cross-compile Go Client Agent (Linux & Windows)
        working-directory: packages/agent-go
        run: |
          mkdir -p ../../dist/agents
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../../dist/agents/fleetops-agent-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../../dist/agents/fleetops-agent-linux-arm64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../../dist/agents/fleetops-agent-windows-amd64.exe .

      - name: Build Docker Image
        run: docker build -t fleetops-ai:ci .
