  <rect x="920" y="16" width="165" height="32" rx="8" fill="#0f172a" stroke="#6366f1"/>
  <text x="935" y="36" fill="#c7d2fe" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">Brain: Claude Sonnet 4.6</text>
  <rect x="1096" y="16" width="160" height="32" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="1112" y="36" fill="#6ee7b7" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">Scope: @group:k8s-prod</text>

  <!-- Left Sessions & MCP Active Tools Column -->
  <g transform="translate(24, 84)" font-family="Inter, system-ui, sans-serif">
    <rect x="0" y="0" width="290" height="652" rx="12" fill="#090d16" stroke="#1e293b"/>
    <text x="18" y="30" fill="#ffffff" font-size="13" font-weight="700">Active AI Sessions &amp; Runbooks</text>
    <rect x="14" y="44" width="262" height="58" rx="8" fill="#1e1b4b" stroke="#4f46e5"/>
    <text x="26" y="66" fill="#ffffff" font-size="12" font-weight="700">Zoraxy &amp; K3s Memory Triage</text>
    <text x="26" y="86" fill="#a5b4fc" font-size="10">@group:k8s-prod • Claude CLI OAuth</text>

    <rect x="14" y="112" width="262" height="54" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="26" y="134" fill="#cbd5e1" font-size="12" font-weight="600">Switch VLAN &amp; Firewall Backup</text>
    <text x="26" y="152" fill="#64748b" font-size="10">@group:network • Gemini 2.5 Pro</text>

    <rect x="14" y="176" width="262" height="54" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="26" y="198" fill="#cbd5e1" font-size="12" font-weight="600">PostgreSQL Slow Query Audit</text>
    <text x="26" y="216" fill="#64748b" font-size="10">@prod-db-01 • DeepSeek R1</text>

    <text x="18" y="264" fill="#94a3b8" font-size="11" font-weight="700">ATTACHED MCP TOOL SERVERS (55)</text>
    <g font-size="11" fill="#cbd5e1" font-family="monospace">
      <rect x="14" y="278" width="262" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="24" y="296" fill="#38bdf8">✓ mcp-server-kubernetes</text>
      <rect x="14" y="312" width="262" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="24" y="330" fill="#34d399">✓ linux-systemd-journal-mcp</text>
      <rect x="14" y="346" width="262" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="24" y="364" fill="#fbbf24">✓ netmiko-napalm-switch-mcp</text>
      <rect x="14" y="380" width="262" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="24" y="398" fill="#e879f9">✓ proxmox-ve-pbs-mcp</text>
      <rect x="14" y="414" width="262" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="24" y="432" fill="#60a5fa">✓ postgres-dba-tuning-mcp</text>
      <rect x="14" y="448" width="262" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="24" y="466" fill="#fb7185">✓ reverse-proxy-waf-mcp</text>
      <rect x="14" y="482" width="262" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
